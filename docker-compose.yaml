services:
  vault:
    image: hashicorp/vault:1.20
    container_name: dbops-vault
    restart: unless-stopped
    command: server
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    volumes:
      - vault-data:/vault/file
      - ./docker/vault/vault.hcl:/vault/config/vault.hcl:ro
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      test: [ "CMD-SHELL", "vault status" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    image: postgres:17
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: dbops
      POSTGRES_USER: dbops
      POSTGRES_PASSWORD: ${METADATA_DB_PASSWORD:?Set METADATA_DB_PASSWORD in .env}

    ports:
      # Loopback only — mirrors private networking in production.
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbops -d dbops"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 1m

  oracle:
    build:
      context: ./docker/oracle
      dockerfile: Dockerfile
    image: oracle:free
    container_name: oracle
    restart: unless-stopped

    environment:
      ORACLE_DB: FREEPDB1
      ORACLE_USER: DBOPS
      ORACLE_PASSWORD: ${ORACLE_DB_PASSWORD:?Set ORACLE_DB_PASSWORD in .env}

    ports:
      - "127.0.0.1:1523:1521"

    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./docker/oracle:/opt/oracle/scripts/setup:ro
      - ./docker/oracle/grant-privileges.sh:/opt/oracle/scripts/setup/grant-privileges.sh:ro

    healthcheck:
      test: ["CMD", "/opt/oracle/checkDBStatus.sh"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 300s

volumes:
  postgres-data:
  oracle-data:
  vault-data:
