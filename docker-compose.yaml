services:
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    image: postgres:17
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: dbops
      POSTGRES_USER: dbops
      POSTGRES_PASSWORD: ${METADATA_DB_PASSWORD:?Set METADATA_DB_PASSWORD in .env}

    ports:
      # Loopback only — mirrors private networking in production.
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbops -d dbops"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 1m

  oracle:
    build:
      context: ./docker/oracle
      dockerfile: Dockerfile
    image: oracle:free
    container_name: oracle
    restart: unless-stopped

    environment:
      ORACLE_DB: dbops
      ORACLE_USER: dbops
      ORACLE_PASSWORD: ${ORACLE_DB_PASSWORD:?Set ORACLE_DB_PASSWORD in .env}

    ports:
      - "127.0.0.1:1523:1521"

    volumes:
      - oracle-data:/opt/oracle/oradata

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5500/health"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 300s

volumes:
  postgres-data:
  oracle-data:
