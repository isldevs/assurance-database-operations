[versions]
spring-boot = "4.1.2"
# Security overrides: review when upgrading Spring Boot's BOM.
opentelemetry = "1.67.0" # GHSA-ccrj-gw8r-854m
jackson = "3.1.8"
logback = "1.6.7" # Includes CVE-2026-104721 fix.
json-smart = "2.6.1" # CVE-2026-113602; also updates ASM transitively.
json = "20260814"
jacoco = "0.8.14"
spotless = "7.2.1"
google-java-format = "1.28.0"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
opentelemetry-bom = { module = "io.opentelemetry:opentelemetry-bom", version.ref = "opentelemetry" }
jackson-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson" }
spring-boot-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-boot-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }
flyway-oracle = { module = "org.flywaydb:flyway-database-oracle" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
micrometer-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
micrometer-tracing-otel = { module = "io.micrometer:micrometer-tracing-bridge-otel" }
opentelemetry-exporter-otlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp" }
oracle-jdbc = { module = "com.oracle.database.jdbc:ojdbc11" }
postgresql = { module = "org.postgresql:postgresql" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
logback-core = { module = "ch.qos.logback:logback-core", version.ref = "logback" }
json-smart = { module = "net.minidev:json-smart", version.ref = "json-smart" }
accessors-smart = { module = "net.minidev:accessors-smart", version.ref = "json-smart" }
json = { module = "org.json:json", version.ref = "json" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
h2 = { module = "com.h2database:h2" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
