spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:dbops_metadata;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;INIT=CREATE DOMAIN IF NOT EXISTS TIMESTAMPTZ AS TIMESTAMP WITH TIME ZONE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  flyway:
    enabled: true

anonymous-user: test-user

vault:
  address: http://127.0.0.1:8200
  token: test-vault-token
  secret-path: projects/{PROJECT_CODE}/environments/{ENVIRONMENT}/data-sources/{DATA_SOURCE}

management:
  endpoints:
    access:
      default: none

logging:
  level:
    root: WARN

db-operations:
  maximum-total-connections: 3
  registrations:
    - project-code: DEMO
      environment: UAT
      data-source-code: TEST_DB
      engine: POSTGRESQL
      jdbc-url: jdbc:postgresql://127.0.0.1:1/unused
      username: test
      password: test-fixture-not-a-real-secret
      enabled: false
      pool:
        maximum-pool-size: 1


db-target-policy:
  approved-targets:

    - project-code: WING_CORE
      environment: UAT
      data-source-code: CORE_DB_WING
      engine: POSTGRESQL
      jdbc-url: jdbc:postgresql://127.0.0.1:5433/uat_core
      non-production-confirmed: true

    - project-code: WING_CORE
      environment: UAT
      data-source-code: PERSONA_DB_WING
      engine: POSTGRESQL
      jdbc-url: jdbc:postgresql://127.0.0.1:5433/uat_persona
      non-production-confirmed: true

    - project-code: WING_CORE
      environment: STAGE
      data-source-code: CORE_DB_WING
      engine: POSTGRESQL
      jdbc-url: jdbc:postgresql://127.0.0.1:5433/stage_core
      non-production-confirmed: true

    - project-code: SECURITY_TEST
      environment: UAT
      data-source-code: SECURITY_CORE_DB
      engine: POSTGRESQL
      jdbc-url: jdbc:postgresql://127.0.0.1:1/security_test
      non-production-confirmed: true
