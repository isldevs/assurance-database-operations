      environment: UAT
      data-source-code: TEST_DB
      engine: POSTGRESQL
      jdbc-url: jdbc:postgresql://127.0.0.1:1/unused
      username: test
      password: test-fixture-not-a-real-secret
      enabled: false
      pool:
        maximum-pool-size: 1

db-target-policy:
  approved-targets: []
