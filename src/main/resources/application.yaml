logging:
  level:
    root: INFO
    com.company.assurance.dbops: INFO
    com.zaxxer.hikari: INFO
    org.flywaydb: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: OFF

application:
  version: '${APP_VERSION:@applicationVersion@}'

server:
  address: 127.0.0.1
  port: 8080
  shutdown: graceful
  tomcat:
    threads:
      max: 20
      min-spare: 2
    max-connections: 50
    accept-count: 20

management:
  server:
    address: 127.0.0.1
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

spring:
  application:
    name: assurance-database-operations

  threads:
    virtual:
      enabled: false

  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: dbops
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 3000
      idle-timeout: 300000
      max-lifetime: 1800000
      initialization-fail-timeout: 30000

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false

# Operational target datasource
# Independent of the primary metadata datasource.
db-operations:
  registrations:
    - project-code: ORACLE
      pool:
        maximum-pool-size: 1
        minimum-idle: 0
        connection-timeout-ms: 3000
        validation-timeout-ms: 1000
        idle-timeout-ms: 60000
        maximum-lifetime-ms: 1800000
        leak-detection-threshold-ms: 0

# Deny all operational database targets unless explicitly approved.
db-target-policy:
  approved-targets: []
