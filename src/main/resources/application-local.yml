spring:
  config:
    activate:
      on-profile: local

  datasource:
    # Metadata database for project / environment / datasource configuration.
    # Local Docker and production both inject these values through environment variables.
    url: ${POSTGRES_JDBC_URL:}
    username: ${POSTGRES_USERNAME:}
    password: ${POSTGRES_PASSWORD:}

db-operations:
  maximum-total-connections: 10

  registrations:
    # Oracle operational datasource
    - project-code: ORACLE
      data-source-code: ORACLE
      engine: ORACLE
      environment: UAT
      jdbc-url: ${ORACLE_JDBC_URL:}
      username: ${ORACLE_USERNAME:}
      password: ${ORACLE_PASSWORD:}
      enabled: true

# Deny unapproved target destinations by default.
db-target-policy:
  approved-targets:
    - project-code: ORACLE
      environment: UAT
      data-source-code: ORACLE
      engine: ORACLE
      jdbc-url: ${ORACLE_JDBC_URL:}
      non-production-confirmed: true

logging:
  level:
    root: INFO
    com.company.assurance: INFO
    com.zaxxer.hikari: INFO
    org.flywaydb: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: OFF
