spring:
  config:
    activate:
      on-profile: local

  datasource:
    # Metadata database for project / environment / datasource configuration.
    # Local Docker and production both inject these values through environment variables.
    url: ${METADATA_JDBC_URL}
    username: ${METADATA_DB_USERNAME}
    password: ${METADATA_DB_PASSWORD}

vault:
  address: ${VAULT_ADDRESS}
  token: ${VAULT_DEV_ROOT_TOKEN}
  kv-mount: secret
  secret-path: ${VAULT_SECRET_PATH}

db-operations:
  maximum-total-connections: 10

  registrations:
    # Oracle operational datasource
    - project-code: ORACLE
      data-source-code: ORACLE
      engine: ORACLE
      environment: UAT
      jdbc-url: ${ORACLE_JDBC_URL}
      username: ${ORACLE_DB_USERNAME}
      password: ${ORACLE_DB_PASSWORD}
      enabled: true

# Deny unapproved target destinations by default.
db-target-policy:
  approved-targets:
    - project-code: ORACLE
      environment: UAT
      data-source-code: ORACLE
      engine: ORACLE
      jdbc-url: ${ORACLE_JDBC_URL}
      non-production-confirmed: true

anonymous-user: anonymous

logging:
  level:
    root: INFO
    com.company.assurance: INFO
    com.zaxxer.hikari: INFO
    org.flywaydb: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: OFF
