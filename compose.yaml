services:
  demo-postgres:
    # Same engine family as production metadata storage.
    # Local Compose supplies host/port; production supplies managed endpoints via env/K8s.
    image: postgres:17

    environment:
      POSTGRES_DB: dbops_metadata
      POSTGRES_USER: dbops_app
      POSTGRES_PASSWORD: ${DEMO_POSTGRES_APP_PASSWORD:?Set DEMO_POSTGRES_APP_PASSWORD in .env}

    ports:
      # Loopback only — mirrors private networking in production.
      - "127.0.0.1:5433:5432"

    volumes:
      - demo-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbops_app -d dbops_metadata"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  demo-postgres-data:
